<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyGateHub Admin</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo/images-removebg-preview.png}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/x-icon" th:href="@{/images/logo/favicon.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/admin-topbar :: admin_topbar}"></div>
    <div class="d-flex flex-grow-1">
        <div th:replace="~{fragments/admin-sidebar :: div}"></div>
        <main class="flex-grow-1 p-4">
            <div th:replace="~{fragments/flash-messages :: div}"></div>
            <div th:insert="~{:: content}"></div>
        </main>
    </div>
    <div th:replace="~{fragments/admin-footer :: admin_footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('input[type="date"]').forEach(function(el) {
                flatpickr(el, {
                    dateFormat: "Y-m-d",
                    altInput: true,
                    altFormat: "d/m/Y",
                    locale: "vn",
                    defaultDate: el.value || undefined
                });
            });
        });
    </script>
</body>
</html>
