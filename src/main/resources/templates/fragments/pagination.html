<nav xmlns:th="http://www.thymeleaf.org" th:if="${totalPages > 1}" aria-label="Page navigation">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
            <a class="page-link" th:href="@{?(page=${currentPage - 1}, keyword=${keyword})}">Trước</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${currentPage == i} ? 'active'">
            <a class="page-link" th:href="@{?(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
            <a class="page-link" th:href="@{?(page=${currentPage + 1}, keyword=${keyword})}">Sau</a>
        </li>
    </ul>
</nav>
