<header xmlns:th="http://www.thymeleaf.org" th:fragment="header" class="skygate-navbar sticky-top">
    <div class="header-container d-flex align-items-center justify-content-between">
        <a th:href="@{/}" class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="#fff">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
            </div>
            <div class="brand-text">
                <h1>Cổng Trời Đông Giang</h1>
                <span>EcoGate Resort & Nature Park</span>
            </div>
        </a>

        <nav class="d-none d-lg-block">
            <ul class="d-flex align-items-center gap-3 m-0 p-0" style="list-style: none;">
                <li><a th:href="@{/}">Trang chủ</a></li>
                <li><a th:href="@{/#booking}">Đặt dịch vụ</a></li>
                <li><a th:href="@{/tickets}">Vé & combo</a></li>
                <li><a href="#">Khách sạn</a></li>
                <li><a href="#">Ẩm thực</a></li>
                <li><a th:href="@{/#operations}">Vận hành</a></li>
                <li th:if="${currentUser != null and currentUser.isStaff()}" class="dropdown nav-admin-dropdown">
                    <a class="dropdown-toggle text-warning fw-bold d-flex align-items-center gap-1" href="#" id="adminNavDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="color: #f59e0b !important;">
                        Quản trị
                    </a>
                    <ul class="dropdown-menu dropdown-menu-dark shadow" aria-labelledby="adminNavDropdown">
                        <li th:if="${currentUser.isAdmin()}"><a class="dropdown-item" th:href="@{/admin/users}">Quản trị người dùng</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/tickets}">Danh mục vé & combo</a></li>
                        <li><a class="dropdown-item" th:href="@{/admin/ticket-prices}">Cấu hình bảng giá vé</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item" th:href="@{/#operations}">Phân hệ vận hành</a></li>
                    </ul>
                </li>
            </ul>
        </nav>

        <div class="nav-actions d-flex align-items-center gap-2">
            <div class="badge-cart" onclick="typeof openCartModal === 'function' ? openCartModal() : (window.location.href='/#booking')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"/>
                    <circle cx="20" cy="21" r="1"/>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                Giỏ hàng
                <span class="badge-count" id="cartBadge">0</span>
            </div>

            <div th:if="${currentUser != null}" class="d-flex align-items-center gap-2">
                <a th:href="@{/profile}" class="btn btn-outline" style="border-color: #34d399; color: #34d399; text-decoration: none; padding: 6px 14px; font-size: 0.85rem;">
                    <span th:text="${currentUser.hoTen}">Tài khoản</span>
                </a>
                <a th:href="@{/logout}" class="btn btn-logout" style="text-decoration: none; padding: 6px 12px; font-size: 0.85rem;">
                    Đăng xuất
                </a>
            </div>
            <div th:if="${currentUser == null}" class="d-flex align-items-center gap-2">
                <a th:href="@{/login}" class="btn btn-outline" style="text-decoration: none; padding: 6px 14px; font-size: 0.85rem;">
                    Đăng nhập
                </a>
                <a th:href="@{/register}" class="btn btn-gold" style="padding: 6px 14px; font-size: 0.85rem; text-decoration: none;">
                    Đăng ký
                </a>
            </div>
        </div>
    </div>
</header>
<nav xmlns:th="http://www.thymeleaf.org" th:fragment="nav" th:replace="~{fragments/header :: header}"></nav>
