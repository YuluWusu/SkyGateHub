<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết người dùng — SkyGateHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/admin-topbar :: admin_topbar}"></div>
    <div class="d-flex flex-grow-1">
        <div th:replace="~{fragments/admin-sidebar :: div}"></div>
        <main class="flex-grow-1 p-4">
            <div th:replace="~{fragments/flash-messages :: div}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-white mb-1">Chi tiết người dùng</h3>
                    <p class="text-muted mb-0" th:text="'Mã người dùng: ' + ${user.maNguoiDung}"></p>
                </div>
                <div>
                    <a th:href="@{'/admin/users/edit/' + ${user.id}}" class="btn btn-gold fw-bold me-2">Chỉnh sửa</a>
                    <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Quay lại danh sách</a>
                </div>
            </div>

            <div class="card shadow-sm border-0 rounded-3 p-4" style="max-width: 800px;">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Mã người dùng</label>
                        <div class="fw-bold fs-5 text-success" th:text="${user.maNguoiDung}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Tên đăng nhập</label>
                        <div class="fw-bold fs-5 text-white" th:text="${user.tenDangNhap}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Họ và tên</label>
                        <div class="fw-semibold text-white" th:text="${user.hoTen}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Trạng thái tài khoản</label>
                        <div>
                            <span th:if="${user.trangThai}" class="badge bg-success">Đang hoạt động</span>
                            <span th:unless="${user.trangThai}" class="badge bg-secondary">Tạm khóa</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Email liên hệ</label>
                        <div class="text-white" th:text="${user.email != null ? user.email : 'Chưa cập nhật'}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Số điện thoại</label>
                        <div class="text-white" th:text="${user.soDienThoai != null ? user.soDienThoai : 'Chưa cập nhật'}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Vai trò phân quyền</label>
                        <div>
                            <span class="badge bg-warning text-dark me-2" th:if="${user.isAdmin()}">Quản trị viên (Toàn quyền hệ thống)</span>
                            <span class="badge bg-info text-dark me-2" th:if="${!user.isAdmin() and user.isStaff()}" th:text="${user.tenVaiTroHienThi}">Nhân viên</span>
                            <span class="badge bg-secondary me-2" th:if="${!user.isStaff()}">Khách hàng</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Yêu cầu đổi mật khẩu</label>
                        <div>
                            <span th:if="${user.canDoiMatKhau}" class="badge bg-warning bg-opacity-25 text-warning border border-warning border-opacity-50">Cần đổi mật khẩu khi đăng nhập</span>
                            <span th:unless="${user.canDoiMatKhau}" class="badge bg-secondary bg-opacity-25 text-muted">Đã cập nhật mật khẩu an toàn</span>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Ngày khởi tạo</label>
                        <div class="text-muted" th:text="${#temporals.format(user.ngayTao, 'dd/MM/yyyy HH:mm:ss')}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small">Ngày cập nhật gần nhất</label>
                        <div class="text-muted" th:text="${#temporals.format(user.ngayCapNhat, 'dd/MM/yyyy HH:mm:ss')}"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
