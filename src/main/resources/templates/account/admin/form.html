<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Chỉnh sửa người dùng' : 'Thêm người dùng mới'} + ' — SkyGateHub'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/admin-topbar :: admin_topbar}"></div>
    <div class="d-flex flex-grow-1">
        <div th:replace="~{fragments/admin-sidebar :: div}"></div>
        <main class="flex-grow-1 p-4">
            <div th:replace="~{fragments/flash-messages :: div}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold text-dark mb-1" style="letter-spacing: -0.5px;" th:text="${isEdit ? 'Chỉnh sửa người dùng' : 'Thêm người dùng mới'}"></h3>
                    <p class="text-muted mb-0 small">Thiết lập thông tin tài khoản nhân viên và cấu hình phân quyền hệ thống</p>
                </div>
                <a th:href="@{/admin/users}" class="btn btn-outline-secondary px-3 py-2">Quay lại danh sách</a>
            </div>

            <div class="card p-4 p-md-5 w-100 shadow-sm" style="border: 1px solid rgba(52, 211, 153, 0.25) !important;">
                <form th:action="${isEdit} ? @{'/admin/users/edit/' + ${userId}} : @{/admin/users/create}" th:object="${userRequest}" method="post">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="usernameInput" class="form-label fw-semibold">Tên đăng nhập (*)</label>
                            <input type="text" class="form-control" id="usernameInput" th:field="*{tenDangNhap}" th:readonly="${isEdit}" required placeholder="Tên đăng nhập duy nhất">
                        </div>
                        <div class="col-md-6">
                            <label for="passwordInput" class="form-label fw-semibold" th:text="${isEdit ? 'Mật khẩu mới (bỏ trống nếu không đổi)' : 'Mật khẩu khởi tạo (*)'}"></label>
                            <input type="password" class="form-control" id="passwordInput" th:field="*{matKhau}" th:required="${!isEdit}" placeholder="Nhập mật khẩu (ví dụ: 123456)">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="fullNameInput" class="form-label fw-semibold">Họ và tên (*)</label>
                            <input type="text" class="form-control" id="fullNameInput" th:field="*{hoTen}" required placeholder="Họ và tên nhân viên">
                        </div>
                        <div class="col-md-6">
                            <label for="roleSelect" class="form-label fw-semibold">Vai trò hệ thống (*)</label>
                            <select class="form-select" id="roleSelect" th:field="*{maVaiTro}" required>
                                <option value="">-- Chọn vai trò --</option>
                                <option th:each="r : ${roles}" th:value="${r.maVaiTro}" th:text="${(r.maVaiTro == 'VT001' ? 'Quản trị viên' : (r.maVaiTro == 'VT004' ? 'Nhân viên bán vé' : (r.maVaiTro == 'VT005' ? 'Nhân viên nhà hàng' : (r.maVaiTro == 'VT006' ? 'Nhân viên lưu trú' : r.tenVaiTro))))} + (${r.moTa != null and !r.moTa.isEmpty()} ? ' — ' + ${r.moTa} : '') + ' (' + ${r.maVaiTro} + ')'"></option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="emailInput" class="form-label fw-semibold">Email liên hệ</label>
                            <input type="email" class="form-control" id="emailInput" th:field="*{email}" placeholder="email@skygatehub.vn">
                        </div>
                        <div class="col-md-6">
                            <label for="phoneInput" class="form-label fw-semibold">Số điện thoại</label>
                            <input type="tel" class="form-control" id="phoneInput" th:field="*{soDienThoai}" placeholder="0905xxxxxx">
                        </div>
                    </div>

                    <div class="row g-3 mb-4 p-3 rounded-3" style="background: #f8fafc; border: 1px solid #e2e8f0;">
                        <div class="col-md-6">
                            <div class="form-check form-switch mt-1">
                                <input class="form-check-input" type="checkbox" id="statusSwitch" th:field="*{trangThai}">
                                <label class="form-check-label fw-semibold text-dark" for="statusSwitch">Kích hoạt tài khoản</label>
                            </div>
                            <small class="text-muted d-block">Cho phép người dùng đăng nhập vào hệ thống</small>
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch mt-1">
                                <input class="form-check-input" type="checkbox" id="changePasswordSwitch" th:field="*{canDoiMatKhau}">
                                <label class="form-check-label fw-semibold text-dark" for="changePasswordSwitch">Bắt buộc đổi mật khẩu</label>
                            </div>
                            <small class="text-muted d-block">Yêu cầu đổi mật khẩu ở lần đăng nhập tiếp theo</small>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top border-secondary border-opacity-25">
                        <a th:href="@{/admin/users}" class="btn btn-outline-secondary px-4 py-2">Hủy bỏ</a>
                        <button type="submit" class="btn btn-gold fw-bold px-4 py-2" th:text="${isEdit ? 'Lưu thay đổi' : 'Tạo tài khoản'}">Lưu thay đổi</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
