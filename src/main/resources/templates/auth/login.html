<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — SkyGateHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center py-5">
    <div class="container" style="max-width: 440px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #10b981, #064e3b); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4); border: 1px solid rgba(255, 255, 255, 0.2);">
                <span style="font-size: 26px; font-weight: 900; color: #f59e0b; letter-spacing: -1px;">SG</span>
            </div>
            <h3 class="fw-bold text-white mb-1" style="letter-spacing: -0.5px;">Cổng Trời Đông Giang</h3>
            <p class="text-muted small">Hệ sinh thái Quản trị & Đặt vé du lịch SkyGateHub</p>
        </div>

        <div th:replace="~{fragments/flash-messages :: div}"></div>

        <div class="card p-4 p-md-5" style="border: 1px solid rgba(52, 211, 153, 0.25) !important;">
            <h4 class="fw-bold text-center text-white mb-4" style="font-size: 1.35rem;">Đăng nhập hệ thống</h4>
            <form th:action="@{/login}" method="post">
                <input type="hidden" name="redirect" th:value="${redirect}" />
                <div class="mb-3">
                    <label for="usernameInput" class="form-label fw-semibold">Tên đăng nhập</label>
                    <input type="text" class="form-control form-control-lg" id="usernameInput" name="tenDangNhap" required autofocus placeholder="Tên đăng nhập">
                </div>
                <div class="mb-4">
                    <label for="passwordInput" class="form-label fw-semibold">Mật khẩu</label>
                    <input type="password" class="form-control form-control-lg" id="passwordInput" name="matKhau" required placeholder="Nhập mật khẩu">
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-gold btn-lg fw-bold py-3">Đăng nhập ngay</button>
                </div>
            </form>
            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                <span class="text-muted small">Chưa có tài khoản khách hàng? </span>
                <a th:href="@{/register}" class="text-success fw-bold text-decoration-none small">Đăng ký ngay</a>
            </div>
            <div class="text-center mt-2">
                <a th:href="@{/}" class="text-muted text-decoration-none small">Trở về trang chủ</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
