<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản — SkyGateHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/customer.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/x-icon" th:href="@{/images/logo/favicon.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center py-5">
    <div class="container" style="max-width: 600px;">
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #10b981, #064e3b); box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4); border: 1px solid rgba(255, 255, 255, 0.2);">
                <span style="font-size: 26px; font-weight: 900; color: #f59e0b; letter-spacing: -1px;">SG</span>
            </div>
            <h3 class="fw-bold text-white mb-1" style="letter-spacing: -0.5px;">Đăng ký thành viên</h3>
            <p class="text-muted small">Trải nghiệm dịch vụ du lịch sinh thái Cổng Trời Đông Giang</p>
        </div>

        <div th:replace="~{fragments/flash-messages :: div}"></div>

        <div class="card p-4 p-md-5" style="border: 1px solid rgba(52, 211, 153, 0.25) !important;">
            <h4 class="fw-bold text-center text-white mb-4" style="font-size: 1.35rem;">Thông tin tài khoản</h4>
            <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="regUsername" class="form-label fw-semibold">Tên đăng nhập (*)</label>
                        <input type="text" class="form-control" id="regUsername" th:field="*{tenDangNhap}" required placeholder="Ví dụ: nguyenvana">
                    </div>
                    <div class="col-md-6">
                        <label for="regFullName" class="form-label fw-semibold">Họ và tên (*)</label>
                        <input type="text" class="form-control" id="regFullName" th:field="*{hoTen}" required placeholder="Ví dụ: Nguyễn Văn A">
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="regEmail" class="form-label fw-semibold">Địa chỉ email</label>
                        <input type="email" class="form-control" id="regEmail" th:field="*{email}" placeholder="Email của bạn">
                    </div>
                    <div class="col-md-6">
                        <label for="regPhone" class="form-label fw-semibold">Số điện thoại</label>
                        <input type="tel" class="form-control" id="regPhone" th:field="*{soDienThoai}" placeholder="Số điện thoại">
                    </div>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="regPassword" class="form-label fw-semibold">Mật khẩu (*)</label>
                        <input type="password" class="form-control" id="regPassword" th:field="*{matKhau}" required placeholder="Tối thiểu 6 ký tự">
                    </div>
                    <div class="col-md-6">
                        <label for="regConfirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu (*)</label>
                        <input type="password" class="form-control" id="regConfirmPassword" th:field="*{xacNhanMatKhau}" required placeholder="Nhập lại mật khẩu">
                    </div>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-gold btn-lg fw-bold py-3">Hoàn tất đăng ký tài khoản</button>
                </div>
            </form>
            <div class="text-center mt-4 pt-3 border-top border-secondary border-opacity-25">
                <span class="text-muted small">Đã có tài khoản hệ thống? </span>
                <a th:href="@{/login}" class="text-success fw-bold text-decoration-none small">Đăng nhập ngay</a>
            </div>
            <div class="text-center mt-2">
                <a th:href="@{/}" class="text-muted text-decoration-none small">Trở về trang chủ</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
