<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Chỉnh sửa bảng giá' : 'Thêm bảng giá mới'} + ' — SkyGateHub'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/admin-topbar :: admin_topbar}"></div>
    <div class="d-flex flex-grow-1">
        <div th:replace="~{fragments/admin-sidebar :: div}"></div>
        <main class="flex-grow-1 p-4">
            <div th:replace="~{fragments/flash-messages :: div}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-dark mb-1" th:text="${isEdit ? 'Chỉnh sửa bảng giá' : 'Thêm bảng giá mới'}"></h3>
                    <p class="text-muted mb-0">Cấu hình đơn giá theo loại vé, thời gian và điều kiện ngày</p>
                </div>
                <a th:href="@{/admin/ticket-prices}" class="btn btn-outline-secondary">← Quay lại bảng giá</a>
            </div>

            <div class="card shadow-sm border-0 rounded-3 p-4 p-md-5 w-100" style="border: 1px solid rgba(52, 211, 153, 0.25) !important;">
                <form th:action="${isEdit} ? @{'/admin/ticket-prices/edit/' + ${priceId}} : @{/admin/ticket-prices/create}" th:object="${priceRequest}" method="post">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="priceCode" class="form-label fw-semibold">
                                Mã bảng giá <span class="badge bg-secondary ms-1 small">Tự động sinh</span>
                            </label>
                            <input type="text" class="form-control font-monospace" id="priceCode" th:field="*{maBangGia}" readonly placeholder="Tự động sinh (BG...)">
                            <small class="text-muted small">Mã bảng giá tự động tăng dần theo thứ tự (ví dụ: BG26, BG27...)</small>
                        </div>
                        <div class="col-md-6">
                            <label for="ticketSelect" class="form-label fw-semibold">Loại vé áp dụng (*)</label>
                            <select class="form-select" id="ticketSelect" th:field="*{maLoaiVe}" required>
                                <option value="">-- Chọn loại vé --</option>
                                <option th:each="t : ${tickets}" th:value="${t.maLoaiVe}" th:text="${t.tenLoaiVe} + ' (' + ${t.maLoaiVe} + ')'"></option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="priceName" class="form-label fw-semibold">Tên bảng giá (*)</label>
                        <input type="text" class="form-control" id="priceName" th:field="*{tenBangGia}" required placeholder="Ví dụ: Giá vé ngày lễ 30/4 - 1/5, Giá mùa cao điểm...">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="priceCondition" class="form-label fw-semibold">Điều kiện áp dụng (*)</label>
                            <select class="form-select" id="priceCondition" th:field="*{dieuKienGia}" required>
                                <option value="MAC_DINH">Mặc định (Ngày thường)</option>
                                <option value="CUOI_TUAN">Cuối tuần (Thứ 7 & Chủ nhật)</option>
                                <option value="NGAY_LE">Ngày lễ / Tết (+20%)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="unitPrice" class="form-label fw-semibold">Đơn giá vé (VNĐ) (*)</label>
                            <input type="number" step="1000" min="0" class="form-control" id="unitPrice" th:field="*{donGia}" required placeholder="180000">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="validFrom" class="form-label fw-semibold">Hiệu lực từ ngày (*) <span class="text-muted small fw-normal">(dd/mm/yyyy)</span></label>
                            <input type="date" class="form-control" id="validFrom" th:field="*{hieuLucTu}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="validTo" class="form-label fw-semibold">Hiệu lực đến ngày <span class="text-muted small fw-normal">(Để trống nếu vô thời hạn - dd/mm/yyyy)</span></label>
                            <input type="date" class="form-control" id="validTo" th:field="*{hieuLucDen}">
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="priority" class="form-label fw-semibold">Độ ưu tiên (Số càng cao càng ưu tiên)</label>
                            <input type="number" class="form-control" id="priority" th:field="*{uuTien}" value="0">
                        </div>
                        <div class="col-md-6">
                            <div class="form-check form-switch mt-4 pt-1">
                                <input class="form-check-input" type="checkbox" id="statusSwitch" th:field="*{trangThai}">
                                <label class="form-check-label fw-semibold" for="statusSwitch">Áp dụng bảng giá</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="note" class="form-label fw-semibold">Ghi chú</label>
                        <input type="text" class="form-control" id="note" th:field="*{ghiChu}" placeholder="Ghi chú điều kiện áp dụng...">
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/admin/ticket-prices}" class="btn btn-secondary">Hủy bỏ</a>
                        <button type="submit" class="btn btn-gold fw-bold px-4" th:text="${isEdit ? 'Lưu thay đổi' : 'Tạo bảng giá'}"></button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/vn.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('input[type="date"]').forEach(function(el) {
                flatpickr(el, {
                    dateFormat: "Y-m-d",
                    altInput: true,
                    altFormat: "d/m/Y",
                    locale: "vn",
                    defaultDate: el.value || undefined
                });
            });
        });
    </script>
</body>
</html>
