<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? 'Chỉnh sửa loại vé' : 'Thêm loại vé mới'} + ' — SkyGateHub'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/admin-topbar :: admin_topbar}"></div>
    <div class="d-flex flex-grow-1">
        <div th:replace="~{fragments/admin-sidebar :: div}"></div>
        <main class="flex-grow-1 p-4">
            <div th:replace="~{fragments/flash-messages :: div}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h3 class="fw-bold text-dark mb-1" style="letter-spacing: -0.5px;" th:text="${isEdit ? 'Chỉnh sửa loại vé' : 'Thêm loại vé mới'}"></h3>
                    <p class="text-muted mb-0 small">Cấu hình thông tin vé tham quan, phân loại và hạn mức kinh doanh</p>
                </div>
                <a th:href="@{/admin/tickets}" class="btn btn-outline-secondary px-3 py-2">Quay lại danh sách vé</a>
            </div>

            <div class="card p-4 p-md-5 w-100 shadow-sm" style="border: 1px solid rgba(52, 211, 153, 0.25) !important;">
                <form th:action="${isEdit} ? @{'/admin/tickets/edit/' + ${ticketId}} : @{/admin/tickets/create}" th:object="${ticketRequest}" method="post">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="ticketCode" class="form-label fw-semibold">
                                Mã loại vé <span class="badge bg-secondary ms-1 small">Tự động sinh</span>
                            </label>
                            <input type="text" class="form-control font-monospace" id="ticketCode" th:field="*{maLoaiVe}" readonly placeholder="Tự động sinh theo chuỗi tăng dần">
                            <small class="text-muted small">Mã vé được sinh tự động theo thứ tự tăng dần (ví dụ: VE26, VE27...)</small>
                        </div>
                        <div class="col-md-6">
                            <label for="ticketType" class="form-label fw-semibold">Phân loại vé (*)</label>
                            <select class="form-select" id="ticketType" th:field="*{loaiVe}" required>
                                <option th:each="type : ${loaiVeTypes}" th:value="${type}" th:text="${type.name() == 'TRON_GOI' ? 'Combo trọn gói' : (type.name() == 'NGUOI_LON' ? 'Vé người lớn' : (type.name() == 'TRE_EM' ? 'Vé trẻ em' : 'Khác / Tiện ích'))}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="ticketName" class="form-label fw-semibold">Tên loại vé (*)</label>
                            <input type="text" class="form-control" id="ticketName" th:field="*{tenLoaiVe}" required placeholder="Ví dụ: Vé Cổng Người Lớn, Combo 1 Ngày...">
                        </div>
                        <div class="col-md-6">
                            <label for="ticketPrice" class="form-label fw-semibold">Giá vé cơ bản (VNĐ) (*)</label>
                            <input type="number" step="1000" min="0" class="form-control text-gold fw-bold" id="ticketPrice" th:field="*{giaVe}" required placeholder="Ví dụ: 150000">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="ticketDesc" class="form-label fw-semibold">Mô tả quyền lợi & Tiện ích bao gồm</label>
                        <textarea class="form-control" id="ticketDesc" rows="3" th:field="*{moTa}" placeholder="Nhập quyền lợi, tiện ích bao gồm, điều kiện miễn phí trẻ em..."></textarea>
                    </div>

                    <div class="row g-3 mb-4 p-3 rounded-3" style="background: #f8fafc; border: 1px solid #e2e8f0;">
                        <div class="col-12">
                            <div class="form-check form-switch mt-1">
                                <input class="form-check-input" type="checkbox" id="statusSwitch" th:field="*{trangThai}">
                                <label class="form-check-label fw-semibold text-dark" for="statusSwitch">Kích hoạt mở bán trên toàn hệ thống</label>
                            </div>
                            <small class="text-muted d-block">Cho phép khách du lịch nhìn thấy và đặt vé trực tuyến</small>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top border-secondary border-opacity-25">
                        <a th:href="@{/admin/tickets}" class="btn btn-outline-secondary px-4 py-2">Hủy bỏ</a>
                        <button type="submit" class="btn btn-gold fw-bold px-4 py-2" th:text="${isEdit ? 'Lưu thay đổi' : 'Tạo loại vé'}">Lưu thay đổi</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
