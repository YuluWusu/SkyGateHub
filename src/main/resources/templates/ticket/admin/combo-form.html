<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cấu hình thành phần combo — SkyGateHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    <link rel="icon" type="image/x-icon" th:href="@{/images/logo/favicon.ico}">
    <link rel="shortcut icon" type="image/x-icon" th:href="@{/favicon.ico}">
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/admin-topbar :: admin_topbar}"></div>
    <div class="d-flex flex-grow-1">
        <div th:replace="~{fragments/admin-sidebar :: div}"></div>
        <main class="flex-grow-1 p-4">
            <div th:replace="~{fragments/flash-messages :: div}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="fw-bold text-dark mb-1">Cấu hình thành phần combo</h3>
                    <p class="text-muted mb-0" th:text="'Gói combo: ' + ${ticket.tenLoaiVe} + ' (' + ${ticket.maLoaiVe} + ')'"></p>
                </div>
                <a th:href="@{/admin/tickets}" class="btn btn-outline-secondary">← Quay lại danh sách vé</a>
            </div>

            <div class="row g-4">
                <div class="col-lg-5">
                    <div class="card shadow-sm border-0 rounded-3 p-4">
                        <h5 class="fw-bold text-success mb-3">+ Thêm thành phần mới</h5>
                        <form th:action="@{'/admin/tickets/' + ${ticket.id} + '/combo'}" th:object="${comboItemRequest}" method="post">
                            <div class="mb-3">
                                <label for="componentSelect" class="form-label fw-semibold">Thành phần dịch vụ (*)</label>
                                <select class="form-select" id="componentSelect" th:field="*{maThanhPhan}" required>
                                    <option value="">-- Chọn dịch vụ thành phần --</option>
                                    <option th:each="comp : ${availableComponents}" th:value="${comp.maThanhPhan}" th:text="${comp.tenThanhPhan} + ' (' + (${comp.loaiThanhPhan != null ? comp.loaiThanhPhan.displayName : 'Dịch vụ'}) + ')'"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="quantityInput" class="form-label fw-semibold">Số lượng mỗi combo (*)</label>
                                <input type="number" class="form-control" id="quantityInput" th:field="*{soLuongMoiCombo}" min="1" value="1" required>
                            </div>
                            <div class="mb-3">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="trackingSwitch" th:field="*{theoDoiSuDung}" checked>
                                    <label class="form-check-label fw-semibold" for="trackingSwitch">Theo dõi lượt sử dụng (chống quét trùng)</label>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="noteInput" class="form-label fw-semibold">Ghi chú</label>
                                <input type="text" class="form-control" id="noteInput" th:field="*{ghiChu}" placeholder="Ví dụ: 1 suất buffet trưa...">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-gold fw-bold">Gán vào combo</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-lg-7">
                    <div class="card shadow-sm border-0 rounded-3 p-4">
                        <h5 class="fw-bold mb-3 text-dark">Các dịch vụ hiện tại trong combo</h5>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Tên thành phần</th>
                                        <th>Loại dịch vụ</th>
                                        <th>Số lượng</th>
                                        <th>Theo dõi</th>
                                        <th class="text-end">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="c : ${comboItems}">
                                        <td class="fw-semibold text-dark" th:text="${c.thanhPhanDichVu.tenThanhPhan}"></td>
                                        <td>
                                            <span th:if="${c.thanhPhanDichVu.loaiThanhPhan != null and c.thanhPhanDichVu.loaiThanhPhan.name() == 'THAM_QUAN'}" class="badge bg-success">Tham quan</span>
                                            <span th:if="${c.thanhPhanDichVu.loaiThanhPhan != null and c.thanhPhanDichVu.loaiThanhPhan.name() == 'CAP_TREO'}" class="badge bg-info text-dark">Cáp treo</span>
                                            <span th:if="${c.thanhPhanDichVu.loaiThanhPhan != null and c.thanhPhanDichVu.loaiThanhPhan.name() == 'AN_UONG'}" class="badge bg-warning text-dark">Ẩm thực</span>
                                            <span th:if="${c.thanhPhanDichVu.loaiThanhPhan != null and c.thanhPhanDichVu.loaiThanhPhan.name() == 'XE_DIEN'}" class="badge bg-primary">Xe điện</span>
                                            <span th:if="${c.thanhPhanDichVu.loaiThanhPhan != null and c.thanhPhanDichVu.loaiThanhPhan.name() == 'KHAC'}" class="badge bg-secondary">Tiện ích khác</span>
                                        </td>
                                        <td class="fw-bold text-center text-success" th:text="${c.soLuongMoiCombo}"></td>
                                        <td>
                                            <span th:if="${c.theoDoiSuDung}" class="badge bg-success">Có</span>
                                            <span th:unless="${c.theoDoiSuDung}" class="badge bg-secondary">Không</span>
                                        </td>
                                        <td class="text-end">
                                            <a th:href="@{'/admin/tickets/' + ${ticket.id} + '/combo/delete/' + ${c.id}}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Xóa thành phần này khỏi combo?');">Xóa</a>
                                        </td>
                                    </tr>
                                    <tr th:if="${comboItems.isEmpty()}">
                                        <td colspan="5" class="text-center py-4 text-muted">Chưa có thành phần nào. Hãy thêm ở biểu mẫu bên trái.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div th:replace="~{fragments/admin-footer :: admin_footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
