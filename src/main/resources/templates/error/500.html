<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>500 - Lỗi Máy Chủ — SkyGateHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
</head>
<body class="d-flex min-vh-100 justify-content-center align-items-center text-center">
    <div class="card p-5 shadow border-0 rounded-4" style="max-width: 520px;">
        <h1 class="display-1 fw-bold text-danger">500</h1>
        <h4 class="fw-bold text-white">Lỗi Máy Chủ Nội Bộ</h4>
        <p class="text-muted" th:text="${errorMessage != null ? errorMessage : 'Đã xảy ra sự cố khi xử lý yêu cầu. Vui lòng thử lại sau.'}">Đã xảy ra sự cố khi xử lý yêu cầu. Vui lòng thử lại sau.</p>
        <div class="d-flex flex-wrap justify-content-center gap-2 mt-3">
            <a th:if="${currentUser != null and currentUser.isStaff()}"
               th:href="@{${currentUser.defaultAdminUrl}}"
               class="btn btn-gold fw-bold px-3">
                <i class="bi bi-speedometer2 me-1"></i>Về Trang Quản Trị Của Bạn
            </a>
            <button type="button" onclick="history.back()" class="btn btn-outline-secondary fw-semibold px-3">
                <i class="bi bi-arrow-left me-1"></i>Quay Lại
            </button>
            <a th:href="@{/}" class="btn btn-success fw-bold px-3">
                <i class="bi bi-house me-1"></i>Về Trang Chủ
            </a>
        </div>
    </div>
</body>
</html>
