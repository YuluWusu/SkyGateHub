# ================= APPLICATION =================
spring.application.name=SkyGateHub
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.profiles.active=dev

# ================= DATASOURCE (MySQL 8.x) =================
spring.datasource.url=jdbc:mysql://localhost:3306/QL_CONG_TROI_DONG_GIANG?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
# === Phi Long
#spring.datasource.username=${DB_USERNAME:root}
#spring.datasource.password=${DB_PASSWORD:123123}
# === Anh Khoa
#spring.datasource.username=${DB_USERNAME:root}
#spring.datasource.password=${DB_PASSWORD:151006}

# ================= JPA / HIBERNATE =================
# DB la nguon su that: chi kiem tra khop, KHONG tu sua bang
spring.jpa.hibernate.ddl-auto=validate
# Giu nguyen ten bang/cot IN HOA nhu @Table/@Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ================= THYMELEAF =================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8

# ================= I18N / VALIDATION =================
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# ================= NGHIEP VU (da chot - Muc 8) =================
# D3: ty le dat coc 30% tong tien
app.deposit-rate=0.30
# Tien to ma don: CTDG-yyMMdd-XXXX
app.order-code-prefix=CTDG
# D2: ngay le lap lai hang nam (MM-dd)
app.holidays=01-01,04-30,05-01,09-02